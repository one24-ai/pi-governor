name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tests and type check link the installed pi's packages; install the pi version this targets.
      - run: pnpm add --global @earendil-works/pi-coding-agent@1.2.0
      - run: pnpm check
      - name: The packed tarball has the compiled exports and the host extension
        run: |
          pnpm pack
          tar tzf pi-governor-*.tgz | grep -q '^package/dist/governor/client.js$'
          tar tzf pi-governor-*.tgz | grep -q '^package/dist/governor/client.d.ts$'
          tar tzf pi-governor-*.tgz | grep -q '^package/dist/governor/index.js$'
          tar tzf pi-governor-*.tgz | grep -q '^package/extensions/governor/host.ts$'
