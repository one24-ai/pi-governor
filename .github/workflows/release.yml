name: Release

on:
  push:
    tags: ["v*.*.*"]

# Published with npm trusted publishing (OIDC): no npm token is stored anywhere. npm accepts the
# run because the package's trusted publisher names this repository, this workflow file and the
# "npm" environment, and it adds provenance on its own. See RELEASING.md.
permissions:
  contents: write # create the GitHub release
  id-token: write # the OIDC token npm exchanges for a short-lived publish token

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm add --global @earendil-works/pi-coding-agent@1.2.0
      - run: pnpm check
      - name: Tag matches package.json
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # Trusted publishing needs npm 11.5.1 or later and is documented for `npm publish` only.
      - run: npm install --global npm@12.2.0
      # Skipped when this version is already on npm (the first release is published by hand,
      # because npm only lets a trusted publisher be set on a package that exists).
      - name: Publish pi-governor
        run: |
          v="${GITHUB_REF_NAME#v}"
          if npm view "pi-governor@$v" version >/dev/null 2>&1; then echo "pi-governor $v is already published"; else npm publish; fi
      - name: GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "pi-governor $v" --notes-file notes.md
